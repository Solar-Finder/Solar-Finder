# Render Blueprint für das Backend. In Render: New → Blueprint → dieses Repository wählen.
# Das Frontend läuft auf Vercel (Root Directory: frontend, NEXT_PUBLIC_API_URL auf diese URL + /api/v1).
services:
  - type: web
    name: pv-prognose-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      # Vercel-Adresse des Frontends, kommagetrennt bei mehreren (nach dem ersten Vercel-Deploy eintragen)
      - key: CORS_ORIGINS
        sync: false
      # Optional: Vorschau-Deployments von Vercel zulassen, z. B. https://pv-prognose-.*\.vercel\.app
      - key: CORS_ORIGIN_REGEX
        sync: false
