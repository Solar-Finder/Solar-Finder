# CI: Lint, Unit-Tests, API-Vertrag, Integrationstests, Docker-Build.
# Läuft bei jedem Pull Request auf main und bei jedem Merge in main.
# Bei main werden die Images zusätzlich nach ghcr.io gepusht (Grundlage für Staging/Production).
name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Backend – Lint, Unit-Tests, API-Vertrag
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          ruff check app tests
          pytest tests/unit
          python -m app.export_openapi
          git diff --exit-code ../docs/api/openapi.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend – Build
        working-directory: frontend
        run: npm ci && npm run build

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stack starten (wartet auf den Healthcheck des Backends)
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend/tests/integration -rx
        env:
          API_BASE_URL: http://localhost:8000/api/v1
      - name: Backend-Protokoll bei Fehler
        if: failure()
        run: docker compose logs backend

  docker-build:
    name: docker-build (${{ matrix.service }})
    needs: integration-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            file: backend/Dockerfile
          - service: frontend
            context: ./frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
            - name: Registry-Namensraum aus dem Repo-Besitzer ableiten
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "Pushe nach ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: certs=./certs
          build-args: NEXT_PUBLIC_API_URL=/api/v1
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/solar-finder-${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}